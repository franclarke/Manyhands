<!-- @dsCard group="Núcleo" name="StatusPill · actual" -->
<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StatusPill · actual</title>
  <link rel="stylesheet" href="../tokens.css" />
  <style>
    body { margin: 0; font-family: var(--font-sans); color: var(--color-text); background: var(--color-bg); padding: 28px; }
    .hd { margin: 0 0 4px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--color-text-subtle); }
    .sub { margin: 0 0 24px; font-size: 13px; color: var(--color-text-muted); max-width: 62ch; line-height: 1.5; }
    .rowlbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-subtle); margin: 18px 0 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    .pill { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid; font-weight: 500; font-variant-numeric: tabular-nums; }
    .pill.md { height: 24px; gap: 6px; padding: 0 8px; font-size: 12px; }
    .pill.mini { height: 20px; gap: 4px; padding: 0 6px; font-size: 11px; }
    .dot { flex: none; border-radius: 999px; box-sizing: border-box; background: currentColor; }
    .pill.md .dot { width: 6px; height: 6px; }
    .pill.mini .dot { width: 4px; height: 4px; }
    .dot.live { animation: tw-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes tw-pulse { 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <p class="hd">Núcleo · C2</p>
  <p class="sub">Estado <b>actual</b>: punto sólido para todos los estados; lo "vivo" usa <code>animate-pulse</code> (parpadeo de opacidad genérico de Tailwind). El estado lo carga el color + el label.</p>

  <p class="rowlbl">md</p>
  <div class="row" id="md"></div>
  <p class="rowlbl">mini</p>
  <div class="row" id="mini"></div>

  <script>
    const STATES = [
      ["idle", "Inactivo", false], ["pending", "Pendiente", false],
      ["running", "Ejecutando", true], ["integrating", "Integrando", true],
      ["ready", "Listo", false], ["completed", "Completado", false],
      ["needs_review", "Para revisar", false], ["blocked", "Bloqueado", false],
      ["failed", "Fallido", false], ["conflict", "Conflicto", false],
      ["integrated", "Integrado", false], ["skipped", "Omitido", false]
    ];
    const TOK = { needs_review: "review" };
    function pill(size, key, label, live) {
      const t = TOK[key] || key;
      const el = document.createElement("span");
      el.className = "pill " + size;
      el.style.color = `var(--status-${t}-fg)`;
      el.style.background = `var(--status-${t}-bg)`;
      el.style.borderColor = `var(--status-${t}-border)`;
      el.innerHTML = `<span class="dot${live ? " live" : ""}"></span>${label}`;
      return el;
    }
    for (const [k, l, live] of STATES) {
      document.getElementById("md").appendChild(pill("md", k, l, live));
      document.getElementById("mini").appendChild(pill("mini", k, l, live));
    }
  </script>
</body>
</html>
