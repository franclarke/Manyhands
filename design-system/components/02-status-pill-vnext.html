<!-- @dsCard group="Núcleo" name="StatusPill · v-next (lenguaje unificado)" -->
<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StatusPill · v-next (lenguaje unificado)</title>
  <link rel="stylesheet" href="../tokens.css" />
  <style>
    body { margin: 0; font-family: var(--font-sans); color: var(--color-text); background: var(--color-bg); padding: 28px; }
    .hd { margin: 0 0 4px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--color-accent); }
    .sub { margin: 0 0 24px; font-size: 13px; color: var(--color-text-muted); max-width: 66ch; line-height: 1.5; }
    .rowlbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-subtle); margin: 18px 0 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    .pill { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid; font-weight: 500; font-variant-numeric: tabular-nums; }
    .pill.md { height: 24px; gap: 6px; padding: 0 8px; font-size: 12px; }
    .pill.mini { height: 20px; gap: 4px; padding: 0 6px; font-size: 11px; }
    .dot { flex: none; border-radius: 999px; box-sizing: border-box; background: currentColor; }
    .pill.md .dot { width: 6px; height: 6px; }
    .pill.mini .dot { width: 4px; height: 4px; }
    /* hollow = not started — the one shape distinction that survives at 4–6px and
       matches the DAG node's "empty = no arrancado". */
    .dot.hollow { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
    .pill.mini .dot.hollow { box-shadow: inset 0 0 0 1.25px currentColor; }
    /* live uses the same coral-pulse as the DAG node (from tokens.css), not Tailwind's generic blink. */
  </style>
</head>
<body>
  <p class="hd">Núcleo · C2 · v-next</p>
  <p class="sub">Mismo vocabulario, alineado con el <b>Glyph dial</b> del nodo: punto <b>hueco</b> para no-arrancados (Inactivo · Pendiente · Omitido) y <b>pulso unificado</b> (<code>coral-pulse</code>) para lo vivo. El cuadrado/falló no se mete acá: a 4–6px no se lee y el label + color ya lo cargan.</p>

  <p class="rowlbl">md</p>
  <div class="row" id="md"></div>
  <p class="rowlbl">mini</p>
  <div class="row" id="mini"></div>

  <script>
    const STATES = [
      ["idle", "Inactivo", "hollow"], ["pending", "Pendiente", "hollow"],
      ["running", "Ejecutando", "live"], ["integrating", "Integrando", "live"],
      ["ready", "Listo", "solid"], ["completed", "Completado", "solid"],
      ["needs_review", "Para revisar", "solid"], ["blocked", "Bloqueado", "solid"],
      ["failed", "Fallido", "solid"], ["conflict", "Conflicto", "solid"],
      ["integrated", "Integrado", "solid"], ["skipped", "Omitido", "hollow"]
    ];
    const TOK = { needs_review: "review" };
    function pill(size, key, label, kind) {
      const t = TOK[key] || key;
      const el = document.createElement("span");
      el.className = "pill " + size;
      el.style.color = `var(--status-${t}-fg)`;
      el.style.background = `var(--status-${t}-bg)`;
      el.style.borderColor = `var(--status-${t}-border)`;
      const dotClass = "dot" + (kind === "hollow" ? " hollow" : kind === "live" ? " coral-pulse" : "");
      el.innerHTML = `<span class="${dotClass}"></span>${label}`;
      return el;
    }
    for (const [k, l, kind] of STATES) {
      document.getElementById("md").appendChild(pill("md", k, l, kind));
      document.getElementById("mini").appendChild(pill("mini", k, l, kind));
    }
  </script>
</body>
</html>
