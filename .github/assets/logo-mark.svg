<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ManyHands">
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#141517" stroke="#F1EAD8" stroke-opacity="0.16"/>
  <!-- edges: three parallel tasks converging into one -->
  <g stroke="#B9AD98" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round">
    <path d="M22 18 L43 32"/>
    <path d="M22 32 L43 32"/>
    <path d="M22 46 L43 32"/>
  </g>
  <!-- convergence (integrator) glow -->
  <circle cx="44" cy="32" r="11" fill="#E8843C" fill-opacity="0.18"/>
  <!-- leaf nodes (parallel agents) -->
  <g fill="#0F1012" stroke="#F1EAD8" stroke-width="2.2">
    <circle cx="21" cy="18" r="4.2"/>
    <circle cx="21" cy="32" r="4.2"/>
    <circle cx="21" cy="46" r="4.2"/>
  </g>
  <!-- integrator node (composed result) -->
  <circle cx="44" cy="32" r="6" fill="#E8843C" stroke="#C25A28" stroke-width="1.5"/>
</svg>
