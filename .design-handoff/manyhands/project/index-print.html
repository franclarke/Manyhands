<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ManyHands — Print</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    /* Each artboard prints on its own 1680×1050 landscape page, no margin. */
    @page { size: 1680px 1050px; margin: 0; }

    html, body {
      margin: 0;
      padding: 0;
      background: #0E0E0D;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 1680px;
      height: 1050px;
      overflow: hidden;
      background: #0E0E0D;
      position: relative;
      break-after: page;
      page-break-after: always;
    }
    .page:last-child { break-after: auto; page-break-after: auto; }

    .page-label {
      position: absolute;
      top: 14px;
      right: 22px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(140, 136, 125, 0.6);
      z-index: 200;
      pointer-events: none;
    }

    /* On screen (pre-print preview), stack the pages with a small gap */
    @media screen {
      body { padding: 24px 0; }
      .page {
        margin: 0 auto 24px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }
    }

    @media print {
      body { padding: 0; }
      .page { margin: 0; box-shadow: none; }
      /* Disable animations during print so frames don't flicker */
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Same load order as index.html; screens depend on shared symbols (NODES, EDGES, CanvasWorld, etc.) defined earlier in the chain. -->
  <script type="text/babel" src="screens/ui.jsx"></script>
  <script type="text/babel" src="screens/PlanMode.jsx"></script>
  <script type="text/babel" src="screens/DagCanvas.jsx"></script>
  <script type="text/babel" src="screens/NodeInspector.jsx"></script>
  <script type="text/babel" src="screens/ConflictPredictor.jsx"></script>
  <script type="text/babel" src="screens/MergeSequencer.jsx"></script>
  <script type="text/babel" src="screens/TimelineView.jsx"></script>
  <script type="text/babel" src="screens/BoardView.jsx"></script>
  <script type="text/babel" src="screens/SystemHealth.jsx"></script>

  <script type="text/babel">
    const PAGES = [
      { id: 'plan',      label: '01 · Plan mode',            render: () => <PlanMode /> },
      { id: 'dag-dark',  label: '02 · DAG canvas (dark)',    render: () => <DagCanvas /> },
      { id: 'inspector', label: '03 · Node inspector',       render: () => <NodeInspector /> },
      { id: 'conflict',  label: '04 · Conflict predictor',   render: () => <ConflictPredictor /> },
      { id: 'merge',     label: '05 · Merge sequencer',      render: () => <MergeSequencer /> },
      { id: 'timeline',  label: '06 · Timeline view',        render: () => <TimelineView /> },
      { id: 'board',     label: '07 · Board view',           render: () => <BoardView /> },
      { id: 'health',    label: '08 · System health',        render: () => <SystemHealth /> },
      { id: 'dag-light', label: '09 · DAG canvas (light)',   render: () => <DagCanvas light /> },
    ];

    const App = () => (
      <>
        {PAGES.map((p) => (
          <div key={p.id} className="page">
            <div className="page-label">{p.label}</div>
            {p.render()}
          </div>
        ))}
      </>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Auto-print after fonts + render settle.
    (async () => {
      try { await document.fonts.ready; } catch (e) {}
      // Give Babel-deferred children one more tick to mount, plus a safety buffer.
      await new Promise((r) => requestAnimationFrame(r));
      setTimeout(() => { window.print(); }, 600);
    })();
  </script>
</body>
</html>
