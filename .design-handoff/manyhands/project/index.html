<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manyhands — Graphite Lab</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    body { background: #f0eee9; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Order matters: shared atoms → shared run data → screens. -->
  <script type="text/babel" src="screens/ui.jsx"></script>
  <script type="text/babel" src="screens/data.jsx"></script>
  <script type="text/babel" src="screens/Home.jsx"></script>
  <script type="text/babel" src="screens/NodeInspector.jsx"></script>
  <script type="text/babel" src="screens/Workspace.jsx"></script>
  <script type="text/babel" src="screens/Timeline.jsx"></script>
  <script type="text/babel" src="screens/Board.jsx"></script>
  <script type="text/babel" src="screens/Experiments.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    const W = 1680;
    const H = 1050;

    const Frame = ({ children }) => (
      <div style={{ width: '100%', height: '100%', overflow: 'hidden' }}>{children}</div>
    );

    const App = () => (
      <DesignCanvas>
        <DCSection id="home" title="Command center"
          subtitle="The protagonist is the prompt. Honest controls. Quiet recent runs.">
          <DCArtboard id="home" label="01 · Command center" width={W} height={H}>
            <Frame><Home/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="workspace" title="DAG workspace"
          subtitle="Canvas as a living orchestration map. Task wafers, phase coordinates, organic edges.">
          <DCArtboard id="workspace" label="02 · DAG workspace (canvas + inspector)" width={W} height={H}>
            <Frame><Workspace/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="timeline" title="Timeline"
          subtitle="Oscilloscope-style read-out for parallelism. Mock data labeled honestly.">
          <DCArtboard id="timeline" label="03 · Timeline" width={W} height={H}>
            <Frame><Timeline/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="board" title="Board"
          subtitle="Optional, secondary. Group nodes by state.">
          <DCArtboard id="board" label="04 · Board" width={W} height={H}>
            <Frame><Board/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="experiments" title="Experiments"
          subtitle="Research notebook. Compare granularity at G3 / G6 / G9.">
          <DCArtboard id="experiments" label="05 · Experiments" width={W} height={H}>
            <Frame><Experiments/></Frame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
